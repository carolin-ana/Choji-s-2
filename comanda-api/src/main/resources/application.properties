spring.application.name=comanda-api
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/comanda?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
# Flyway é quem cria/altera as tabelas. Nunca usar create/update aqui.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Busca os itens de vários pedidos de uma vez, em vez de uma consulta por pedido (lista do painel)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=8
app.cors.origins=${CORS_ORIGINS:http://localhost:4200}
